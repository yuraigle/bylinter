[window]
dimensions = { columns = 150, lines = 36 }
decorations = "Full"
opacity = 1
title = "Bylinter"
dynamic_title = false

[debug]
# renderer = "glsl3"
# render_timer = true
# prefer_egl = false

[selection]
save_to_clipboard = true

[font]
size = 12
normal = { family = "Liberation Mono", style = "Regular" }
bold = { family = "Liberation Mono", style = "Regular" }

# https://github.com/alacritty/alacritty-theme/tree/master/themes

# Theme: enfocado_dark
# Source:  https://github.com/wuelnerdotexe/vim-enfocado

# Default colors
[colors.primary]
background =  '#080808'
foreground =  '#b9b9b9'

# Normal colors
[colors.normal]
black   = '#3b3b3b'
red     = '#ed4a46'
green   = '#70b433'
yellow  = '#dbb32d'
blue    = '#368aeb'
magenta = '#eb6eb7'
cyan    = '#3fc5b7'
white   = '#b9b9b9'

# Bright colors
[colors.bright]
black   = '#777777'
red     = '#ff5e56'
green   = '#83c746'
yellow  = '#efc541'
blue    = '#4f9cfe'
magenta = '#ff81ca'
cyan    = '#56d8c9'
white   = '#dedede'
