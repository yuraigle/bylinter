[window]
dimensions = { columns = 150, lines = 36 }
decorations = "Full"
opacity = 1
title = "Bylinter"
dynamic_title = false

[debug]
# renderer = "glsl3"
# render_timer = true
# prefer_egl = false

[selection]
save_to_clipboard = true

[font]
size = 13
normal = { style = "Regular" }
bold = { style = "Regular" }

# указать шрифт, рекомендую "Liberation Mono" или "GeistMono Nerd Font"
# normal = { family = "Liberation Mono", style = "Regular" }
# bold = { family = "Liberation Mono", style = "Regular" }

# https://github.com/alacritty/alacritty-theme/tree/master/themes

# Default colors
[colors.primary]
background = '#101421'
foreground = '#fffbf6'

# Normal colors
[colors.normal]
black   = '#555555'
red     = '#eb4129'
green   = '#abe047'
yellow  = '#f6c744'
blue    = '#47a0f3'
magenta = '#7b5cb0'
cyan    = '#64dbed'
white   = '#e5e9f0'

# Bright colors
[colors.bright]
black   = '#777777'
red     = '#ec5357'
green   = '#c0e17d'
yellow  = '#f9da6a'
blue    = '#49a4f8'
magenta = '#a47de9'
cyan    = '#99faf2'
white   = '#ffffff'
